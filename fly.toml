app = 'feedback-docs'
primary_region = 'yyz'

[build]
  [build.args]
    GO_VERSION = '1.25.0'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '256mb'
  cpus = 1
  memory_mb = 256

[mounts]
  destination = "/pb/pb_data"
  source = "pb_data"
