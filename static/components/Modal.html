<div tabindex="-1"
     role="dialog"
     class="modal">
  <button aria-label="Close" @click="$emit('modal-close')"> ✕ </button>
  <form>
    <div class="icons" :style="feedback.emoji && 'display: flex'">
      <span v-for="name in icons.names">
        <input type="radio"
               v-bind:id="name + '-' + page_id"
               v-bind:value="name"
               v-model="feedback.emoji">
        <label :style="feedback.emoji ? 'display: inline; margin-right: 1rem;' : 'display: block'"
               class="emoji"
               tabindex="0"
               v-bind:for="name + '-' + page_id">
          <span role="img" v-html="icons[name].emoji"></span>
          <span v-if="!feedback.emoji" class="icon-desc">
            {{icons[name].text}}
          </span>
        </label>
      </span>
    </div>
    <div v-if="feedback.emoji">
      <div v-if="admin">
        <!-- to manually enter notes from social media -->
        <label for="name">Name</label> <br>
        <input type="text"
               v-model="feedback.name"
               class="p-2"
               id="name">
      </div>
      <textarea ref="content"
                v-model="feedback.content"
                v-bind:placeholder="icons[feedback.emoji].prompt"></textarea>
      <button class="btn"
              :class="button_text == 'Saving...' ? 'saving' : ''"
              @click.prevent="save">
        {{ button_text }}
      </button>
    </div>
  </form>
</div>
