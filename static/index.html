<html>

<head>
  <script src="/js/vue.global.js"></script>
  <!-- "defer" means that the DOM gets loaded before the script is executed -->
  <script src="/js/text-annotator.umd.js" defer></script>
  <script src="/js/pocketbase.umd.js" defer></script>
  <link rel="stylesheet" href="/css/text-annotator.css">
  <link rel="stylesheet" href="style.css">
  <script src="bundle.js" defer></script>
  <meta charset="utf-8" />
  <!-- make the page responsive (though I don't always want this) -->
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>vue 3 template</title>
</head>

<body>
  <nav class="squiggle-bottom">
  </nav>
  <main id="app">
    <form v-if="!loggedIn"
          class="login"
          @submit.prevent="login">
      {{ errors }}
      Password:
      <input name="password" ref="password">
      <button type="submit" class="btn"> Login
      </button>
    </form>
    <div v-else class="user-feedback-page">
      <div ref="html" v-html="document && document.content">
      </div>
      <div style="position: relative;">
      <section class="comments">
        <h2> Your comments </h2>
        <Modal v-if="active_feedback"
               @modal-close="close"
               @keydown.esc="close"
               @modal-submit="submit"
               v-bind:feedback="active_feedback" />
      </section>
      </div>
    </div>
  </main>
  <footer class="squiggle-top">
    this feedback site was made by <a href="https://marieflanagan.com/">Marie
      Clare LeBlanc Flanagan</a> and <a href="https://jvns.ca">Julia Evans</a>.
    Heavily inspired by <a href="https://helpthisbook.com/">Help This
      Book</a>.
  </footer>
</body>

</html>
